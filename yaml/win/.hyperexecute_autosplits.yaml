---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: win
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 1
env:
  TARGET_OS: "Windows 10"
cacheKey: '{{ checksum "requirement.txt" }}'
cacheDirectories:
  - CacheDir
pre:
  - python -m pip install -r requirement.txt --cache-dir CacheDir
  - npm install playwright@1.48.0
  - playwright install
testDiscovery:
  type: raw
  mode: remote
  command: grep -lr 'def' *.py
testRunnerCommand: python $test
post:
  - cat yaml/win/.hyperexecute_autosplits.yaml

jobLabel: [playwright-Python, win, autosplit]
runtime:
  language: python
  version: "3.11"
