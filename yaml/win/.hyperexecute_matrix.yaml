---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
matrix:
  os: [win]
  files: ["test_app.py"]
runson: ${matrix.os}
pre:
  - python -m pip install -r requirement.txt --cache-dir CacheDir
  - npm install playwright@1.48.0
  - playwright install
cacheKey: '{{ checksum "requirement.txt" }}'
cacheDirectories:
  - CacheDir
testSuites:
  - python $files
post:
  - cat yaml/win/.hyperexecute_matrix.yaml

jobLabel: [playwright-Python, win, matrix]
runtime:
  language: python
  version: "3.11"
